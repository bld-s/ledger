// ───────── 지표 계산 ─────────
const sma = (a, n) => a.map((_, i) => (i < n - 1 ? null : a.slice(i - n + 1, i + 1).reduce((s, v) => s + v, 0) / n));
function rsi(c, n = 14) {
  const out = Array(c.length).fill(null);
  let g = 0, l = 0;
  for (let i = 1; i < c.length; i++) {
    const d = c[i] - c[i - 1];
    if (i <= n) { g += Math.max(d, 0); l += Math.max(-d, 0); if (i === n) { g /= n; l /= n; out[i] = 100 - 100 / (1 + g / (l || 1e-9)); } }
    else { g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n; out[i] = 100 - 100 / (1 + g / (l || 1e-9)); }
  }
  return out;
}

async function fetchCandles(sym, tdKey) {
  const s = sym.toUpperCase();
  if (s === "BTC" || s === "ETH") {
    const id = s === "BTC" ? "bitcoin" : "ethereum";
    const r = await fetch(`https://api.coingecko.com/api/v3/coins/${id}/ohlc?vs_currency=usd&days=180`);
    const j = await r.json();
    return { src: "CoinGecko", rows: j.map(([t, o, h, l, c]) => ({ t, o, h, l, c, v: 0 })) };
  }
  try {
    const r = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${s}?range=6mo&interval=1d`);
    const j = await r.json();
    const q = j.chart.result[0], qq = q.indicators.quote[0];
    return { src: "Yahoo Finance", rows: q.timestamp.map((t, i) => ({ t: t * 1000, o: qq.open[i], h: qq.high[i], l: qq.low[i], c: qq.close[i], v: qq.volume[i] })).filter((x) => x.c != null) };
  } catch (e) {
    if (!tdKey) throw new Error("Yahoo 직접 호출 차단됨(CORS). Twelve Data 무료 키를 입력하거나 CSV를 붙여넣으세요.");
  }
  const r = await fetch(`https://api.twelvedata.com/time_series?symbol=${s}&interval=1day&outputsize=200&apikey=${tdKey}`);
  const j = await r.json();
  if (!j.values) throw new Error(j.message || "Twelve Data 응답 없음");
  return { src: "Twelve Data", rows: j.values.reverse().map((x) => ({ t: Date.parse(x.datetime), o: +x.open, h: +x.high, l: +x.low, c: +x.close, v: +x.volume || 0 })) };
}
function parseCSV(txt) {
  const lines = txt.trim().split(/\r?\n/);
  const head = lines[0].toLowerCase().split(",");
  const ix = (k) => head.findIndex((h) => h.includes(k));
  const [d, o, h, l, c, v] = ["date", "open", "high", "low", "close", "volume"].map(ix);
  return lines.slice(1).map((ln) => { const a = ln.split(","); return { t: Date.parse(a[d]), o: +a[o], h: +a[h], l: +a[l], c: +a[c], v: +a[v] || 0 }; }).filter((x) => x.c).sort((a, b) => a.t - b.t);
}

function CandleChart({ rows }) {
  const W = 720, H = 420, PH = 230, VH = 60, RH = 70, PAD = { l: 8, r: 96 }, VP = 22;
  const data = rows.slice(-120);
  const closes = data.map((r) => r.c);
  const m5 = sma(closes, 5), m20 = sma(closes, 20), m60 = sma(closes, 60), rs = rsi(closes);
  const lo = Math.min(...data.map((r) => r.l)), hi = Math.max(...data.map((r) => r.h));
  const cw = (W - PAD.l - PAD.r) / data.length;
  const y = (p) => 10 + (PH - 20) * (1 - (p - lo) / (hi - lo || 1));
  const x = (i) => PAD.l + i * cw + cw / 2;
  const vmax = Math.max(...data.map((r) => r.v), 1);
  // 매물대 (volume profile)
  const bins = Array(VP).fill(0);
  data.forEach((r) => { const b = Math.min(VP - 1, Math.floor(((r.c - lo) / (hi - lo || 1)) * VP)); bins[b] += r.v || 1; });
  const bmax = Math.max(...bins), poc = bins.indexOf(bmax);
  const line = (arr, col) => <polyline fill="none" stroke={col} strokeWidth="1.3" points={arr.map((v, i) => (v == null ? null : `${x(i)},${y(v)}`)).filter(Boolean).join(" ")} />;
  const last = data[data.length - 1], lastRsi = rs[rs.length - 1];
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", fontFamily: "ui-monospace, monospace" }}>
        {bins.map((b, i) => { const yy = y(lo + ((i + 1) / VP) * (hi - lo)); const hh = (PH - 20) / VP; return <rect key={i} x={W - PAD.r + 4} y={yy} width={(b / bmax) * (PAD.r - 44)} height={hh - 1} fill={i === poc ? "#F2B84B" : "#2B3A52"} opacity="0.9" />; })}
        {[hi, (hi + lo) / 2, lo].map((p) => <text key={p} x={W - 38} y={y(p) + 4} fontSize="10" fill="#8FA3BF">{p.toFixed(p > 100 ? 0 : 2)}</text>)}
        {data.map((r, i) => { const up = r.c >= r.o; const col = up ? "#E5484D" : "#3E7BFA"; return (
          <g key={i}>
            <line x1={x(i)} x2={x(i)} y1={y(r.h)} y2={y(r.l)} stroke={col} strokeWidth="1" />
            <rect x={x(i) - cw * 0.35} y={y(Math.max(r.o, r.c))} width={cw * 0.7} height={Math.max(1, Math.abs(y(r.o) - y(r.c)))} fill={col} />
            <rect x={x(i) - cw * 0.35} y={PH + VH - (r.v / vmax) * (VH - 4)} width={cw * 0.7} height={(r.v / vmax) * (VH - 4)} fill={col} opacity="0.45" />
          </g>); })}
        {line(m5, "#F2B84B")}{line(m20, "#C98FE0")}{line(m60, "#8FA3BF")}
        <text x={PAD.l} y={PH + VH + 14} fontSize="10" fill="#8FA3BF">RSI(14) {lastRsi?.toFixed(1)}</text>
        {[70, 30].map((lv) => <line key={lv} x1={PAD.l} x2={W - PAD.r} y1={PH + VH + 20 + (RH - 24) * (1 - lv / 100)} y2={PH + VH + 20 + (RH - 24) * (1 - lv / 100)} stroke="#2B3A52" strokeDasharray="3 3" />)}
        <polyline fill="none" stroke="#F2B84B" strokeWidth="1.2" points={rs.map((v, i) => (v == null ? null : `${x(i)},${PH + VH + 20 + (RH - 24) * (1 - v / 100)}`)).filter(Boolean).join(" ")} />
      </svg>
      <div className="legend">
        <span style={{ color: "#F2B84B" }}>■ MA5</span><span style={{ color: "#C98FE0" }}>■ MA20</span><span style={{ color: "#8FA3BF" }}>■ MA60</span>
        <span>우측 막대 = 매물대(POC 노랑)</span>
        <span>종가 {last.c.toFixed(2)} · RSI {lastRsi?.toFixed(0)} {lastRsi > 70 ? "과열" : lastRsi < 30 ? "과매도" : "중립"} · {last.c > m20[m20.length - 1] ? "MA20 위" : "MA20 아래"}</span>
      </div>
    </div>
  );
}

  const pull = async (url) => { try { setSyncMsg("시트에서 불러오는 중…"); const r = await fetch(url); const j = await r.json(); if (j.ledger) setSt(j.ledger); else { await fetch(url, { method: "POST", body: JSON.stringify(st) }); } setPrices(j.prices||{}); if (j.fx) { setFxAuto(j.fx); setFx(String(Math.round(j.fx * 10) / 10)); localStorage.setItem("fx", String(Math.round(j.fx * 10) / 10)); } setSyncMsg("동기화됨 " + new Date().toLocaleTimeString("ko-KR")); } catch (e) { setSyncMsg("동기화 실패: " + e.message); } };
  useEffect(() => { if (syncUrl) pull(syncUrl); }, []);

  useEffect(() => { (async () => {
    try { const r = await window.storage.get("ledger"); if (r) setSt(JSON.parse(r.value)); } catch {}
    try { const k = await window.storage.get("tdkey"); if (k) setTdKey(k.value); } catch {}
    try { const r = await window.storage.get("report:" + today()); if (r) setReport(JSON.parse(r.value)); } catch {}
    setLoaded(true);
  })(); }, []);
  const save = async (next) => { setSt(next); try { await window.storage.set("ledger", JSON.stringify(next)); } catch {} if (syncUrl) { try { setSyncMsg("시트에 저장 중…"); await fetch(syncUrl, { method: "POST", body: JSON.stringify(next) }); setSyncMsg("시트 저장됨"); } catch (e) { setSyncMsg("시트 저장 실패: " + e.message); } } };

  // 시세 자동 평가: 시세가 있고 수동 고정(manual)이 아니면 수량×현재가(×환율)
  const autoVal = (h) => { const q = prices[h.sym]; if (!q || !h.sym || h.manual) return null; const krw = h.sym.startsWith("KRX:") ? q.p : q.p * (+fx || fxAuto || 0); return krw ? (h.qty * krw) / 10000 : null; };
  const curVal = (h) => { const a = autoVal(h); return a == null ? h.val : a; };
  const view = useMemo(() => ({ ...st, holdings: st.holdings.map((h) => ({ ...h, val: curVal(h), auto: autoVal(h) != null })) }), [st, prices, fx, fxAuto]);
  const total = useMemo(() => view.holdings.reduce((s, h) => s + h.val, 0), [view]);
  const liquid = useMemo(() => view.holdings.filter((h) => h.type !== "묶임").reduce((s, h) => s + h.val, 0), [view]);
  const byType = useMemo(() => view.holdings.reduce((m, h) => ({ ...m, [h.type]: (m[h.type] || 0) + h.val }), {}), [view]);
  const livingTotal = Object.values(st.living).reduce((a, b) => a + b, 0);
  const cashOnly = byType.현금 || 0;

  const calcAmt = () => { const q = +form.qty, pr = +form.price; if (!q || !pr) return 0; return form.cur === "USD" ? (q * pr * +fx) / 10000 : (q * pr) / 10000; };
  const trade = () => {
    const qty = +form.qty, price = +form.price, amt = calcAmt();
    if (!form.name || !qty || !price) return;
    let hs = [...st.holdings];
    const i = hs.findIndex((h) => h.acct === form.acct && h.name.toUpperCase() === form.name.toUpperCase());
    const cashIx = hs.findIndex((h) => h.acct === form.acct && h.type === "현금");
    const unit = form.cur === "USD" ? "$" : "₩";
    if (form.side === "매수") {
      if (i >= 0) { const oldAvg = parseFloat(String(hs[i].avg || "").replace(/[^0-9.]/g, "")) || 0; const newAvg = oldAvg ? (oldAvg * hs[i].qty + price * qty) / (hs[i].qty + qty) : price; hs[i] = { ...hs[i], qty: hs[i].qty + qty, val: hs[i].val + amt, avg: unit + newAvg.toLocaleString(undefined, { maximumFractionDigits: 2 }) }; }
      else hs.push({ acct: form.acct, name: form.name, sym: form.sym || form.name, qty, val: amt, type: form.type, avg: unit + price.toLocaleString() });
      if (cashIx >= 0) hs[cashIx] = { ...hs[cashIx], val: hs[cashIx].val - amt };
    } else {
      if (i < 0) return alert("해당 계좌에 그 종목이 없습니다");
      if (qty > hs[i].qty) return alert("보유 수량(" + hs[i].qty + ")보다 많습니다");
      const nq = hs[i].qty - qty; const perShare = hs[i].val / hs[i].qty;
      hs[i] = { ...hs[i], qty: nq, val: Math.max(0, hs[i].val - perShare * qty) };
      if (nq <= 0) hs.splice(i, 1);
      if (cashIx >= 0) hs[cashIx] = { ...hs[cashIx], val: hs[cashIx].val + amt };
    }
    save({ ...st, holdings: hs, baseDate: today(), trades: [{ d: today(), side: form.side, acct: form.acct, name: form.name, qty, price: unit + price, amt }, ...st.trades].slice(0, 50) });
    setForm({ ...form, name: "", sym: "", qty: "", price: "" });
  };
  const editVal = (ix, v) => { const hs = [...st.holdings]; hs[ix] = { ...hs[ix], val: +v || 0, manual: true }; save({ ...st, holdings: hs, baseDate: today() }); };
  const resetAuto = (ix) => { const hs = [...st.holdings]; delete hs[ix].manual; save({ ...st, holdings: hs }); };
  const editLiving = (k, v) => save({ ...st, living: { ...st.living, [k]: +v || 0 } });

  const loadChart = async () => {
    setChartMsg("불러오는 중…"); setCandles(null);
    try {
      if (csv.trim()) { setCandles({ src: "붙여넣은 CSV", rows: parseCSV(csv) }); setChartMsg(""); return; }
      const r = await fetchCandles(chartSym, tdKey); setCandles(r); setChartMsg("");
    } catch (e) { setChartMsg(e.message); }
  };

  const runReport = async () => {
    setBusy(true);
    const port = view.holdings.filter((h) => h.type !== "묶임").map((h) => `${h.acct}/${h.name} ${fmt(h.val)}만`).join(", ");
    const prompt = `오늘 날짜 ${today()}. 웹검색으로 오늘의 미국·한국 시장 시황을 조사하고 JSON만 반환해라(마크다운 금지).
조사 항목: 주요 지수 등락, VIX(공포지수), CNN Fear&Greed, S&P500 forward PER, 주도 테마주(섹터), 금/달러/원화/BTC 동향, 주요 이벤트(FOMC·실적·지표).
내 보유: ${port}. 총 유동자산 ${fmt(liquid)}만, 현금성 ${fmt(cashOnly)}만, 월 생활비 ${fmt(livingTotal)}만.
추천 종목 3개는 내 보유·현금 비중·시황·기술적 지표(RSI, 이평선, 거래량 관점)를 근거로 고르되, 각 종목마다 반드시 반대의견(contra)을 써라.
형식: {"date":"...","summary":"3문장 시황","indices":[{"name":"S&P500","chg":"+0.4%"}],"vix":"","fearGreed":"","per":"","themes":["..."],"top3":[{"ticker":"","name":"","why":"","tech":"","contra":"","action":"분할매수|관망|매도"}],"roadmap":[{"scenario":"기본|강세|약세","cash":"현금 %","stock":"주식 %","alt":"대체·코인 %","note":""}],"counter":"전체 시황 판단에 대한 반대의견","sources":["url"]}`;
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", { method: "POST", headers: { "Content-Type": "application/json", "x-api-key": apiKey, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" }, body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages: [{ role: "user", content: prompt }], tools: [{ type: "web_search_20250305", name: "web_search" }] }) });
      const d = await res.json();
      const txt = d.content.filter((c) => c.type === "text").map((c) => c.text).join("\n");
      const js = txt.slice(txt.indexOf("{"), txt.lastIndexOf("}") + 1);
      const rep = JSON.parse(js); setReport(rep);
      try { await window.storage.set("report:" + today(), JSON.stringify(rep)); } catch {}
    } catch (e) { setReport({ error: "분석 실패: " + e.message }); }
    setBusy(false);
  };

  if (!loaded) return <div className="wrap"><p style={{ color: "#8FA3BF" }}>원장 여는 중…</p></div>;
  return (
    <div className="wrap">
      <style>{`
        .wrap{background:#101826;color:#E6E9EF;min-height:100vh;padding:20px 16px 60px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;max-width:980px;margin:0 auto}
        h1{font-family:Georgia,"Noto Serif KR",serif;font-weight:500;font-size:26px;letter-spacing:-.5px;margin:0}
        .eyebrow{font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.18em;color:#8FA3BF;text-transform:uppercase}
        .tabs{display:flex;gap:4px;margin:18px 0;border-bottom:1px solid #2B3A52}
        .tabs button{background:none;border:0;color:#8FA3BF;padding:10px 14px;font-size:14px;cursor:pointer;border-bottom:2px solid transparent}
        .tabs button.on{color:#F2B84B;border-bottom-color:#F2B84B}
        .card{background:#182235;border:1px solid #2B3A52;border-radius:10px;padding:16px;margin-bottom:14px}
        .big{font-family:ui-monospace,monospace;font-size:34px;color:#F2B84B;letter-spacing:-1px}
        .bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:10px 0 6px}
        table{width:100%;border-collapse:collapse;font-size:13px}
        td,th{padding:7px 6px;border-bottom:1px solid #22304a;text-align:left}
        td.n,th.n{text-align:right;font-family:ui-monospace,monospace}
        td input{background:#101826;color:#F2B84B;border:1px solid #2B3A52;border-radius:4px;width:80px;text-align:right;font-family:ui-monospace,monospace;padding:3px}
        .acct{color:#8FA3BF;font-size:11px;letter-spacing:.1em;padding-top:14px}
        .form{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
        .form input,.form select,.in{background:#101826;color:#E6E9EF;border:1px solid #2B3A52;border-radius:6px;padding:9px;font-size:14px;width:100%;box-sizing:border-box}
        .btn{background:#F2B84B;color:#101826;border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;font-size:14px}
        .btn.sec{background:#2B3A52;color:#E6E9EF}
        .btn:disabled{opacity:.5}
        .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:#8FA3BF;margin-top:6px}
        .chip{display:inline-block;background:#2B3A52;border-radius:4px;padding:2px 8px;font-size:12px;margin:2px 4px 2px 0}
        .pick{border-left:3px solid #F2B84B;padding-left:12px;margin:14px 0}
        .contra{color:#C98FE0;font-size:13px}
        .muted{color:#8FA3BF;font-size:13px}
        .warn{background:#2a2230;border:1px solid #C98FE0;border-radius:8px;padding:10px;font-size:13px;color:#E6E9EF}
        @media(max-width:600px){.big{font-size:28px}td,th{padding:6px 4px;font-size:12px}}
      `}</style>

      <div className="eyebrow">자산·생활비 원장 · 기준일 {st.baseDate}</div>
      <h1>총 {fmt(total)}만원 <span className="muted">(유동 {fmt(liquid)}만 · 묶임 {fmt(total - liquid)}만)</span></h1>
      <div className="bar">{Object.entries(byType).map(([k, v]) => <div key={k} title={k} style={{ width: `${(v / total) * 100}%`, background: TYPE_COLOR[k] }} />)}</div>
      <div className="legend">{Object.entries(byType).map(([k, v]) => <span key={k} style={{ color: TYPE_COLOR[k] }}>■ {k} {fmt(v)}만 ({((v / total) * 100).toFixed(0)}%)</span>)}</div>

      <div className="tabs">{["원장", "히트맵", "매매", "차트", "시황"].map((t) => <button key={t} className={tab === t ? "on" : ""} onClick={() => setTab(t)}>{t}</button>)}</div>

      {tab === "원장" && (<>
        <div className="card">
          <div className="eyebrow" style={{ marginBottom: 8 }}>PC·모바일 동기화 (구글 시트)</div>
          <div className="form"><input className="in" placeholder="Apps Script 웹앱 URL" value={syncUrl} onChange={(e) => { setSyncUrl(e.target.value); localStorage.setItem("sync", e.target.value); }} /><button className="btn sec" onClick={() => pull(syncUrl)}>지금 불러오기</button><button className="btn sec" onClick={() => save(st)}>시트에 올리기</button></div>
          <p className="muted" style={{ marginTop: 6 }}>{syncMsg || "주소를 넣으면 매매·수정이 시트에 저장되고, 시트의 GOOGLEFINANCE 시세(현재가·등락)가 원장에 표시됩니다."}</p>
        </div>
        <div className="card">
          <div className="eyebrow">생활비 월 {fmt(livingTotal)}만 · 현금성 자산으로 {Math.floor(cashOnly / livingTotal)}개월 버팀</div>
          <div className="legend" style={{ marginTop: 8 }}>{Object.entries(st.living).map(([k, v]) => <span key={k} className="chip">{k} <input style={{ background: "transparent", border: 0, borderBottom: "1px solid #8FA3BF", color: "#F2B84B", width: 44, fontFamily: "ui-monospace,monospace", textAlign: "right" }} value={v} onChange={(e) => editLiving(k, e.target.value)} /></span>)}</div><p className="muted" style={{ marginTop: 6 }}>고정값 기본, 숫자 클릭해서 수정(만원).</p>
        </div>
        <div className="card">
          <table><thead><tr><th>종목</th><th className="n">수량</th><th className="n">평가(만)</th><th className="n">비중</th></tr></thead>
            <tbody>{ACCTS.map((a) => { const rows = view.holdings.map((h, ix) => ({ ...h, ix })).filter((h) => h.acct === a); if (!rows.length) return null; const sub = rows.reduce((s, h) => s + h.val, 0); return (
              <>
                <tr key={a}><td className="acct" colSpan="2">{a}</td><td className="n acct">{fmt(sub)}</td><td className="n acct">{((sub / total) * 100).toFixed(1)}%</td></tr>
                {rows.map((h) => <tr key={h.ix}><td><span style={{ color: TYPE_COLOR[h.type] }}>●</span> {h.name}{h.avg && <span className="muted"> 평단 {h.avg}</span>}{prices[h.sym] && <span style={{ marginLeft: 6, fontFamily: "ui-monospace,monospace", fontSize: 11, color: prices[h.sym].chg >= 0 ? "#E5484D" : "#3E7BFA" }}>{prices[h.sym].p.toLocaleString()} {prices[h.sym].chg != null && (prices[h.sym].chg >= 0 ? "+" : "") + prices[h.sym].chg.toFixed(2) + "%"}</span>}</td><td className="n">{h.qty === 1 && !h.sym ? "" : h.qty}</td><td className="n"><input value={h.auto ? Math.round(h.val * 10) / 10 : h.val} onChange={(e) => editVal(h.ix, e.target.value)} />{h.auto ? <div className="muted" style={{ fontSize: 10 }}>자동</div> : h.manual && prices[h.sym] ? <div style={{ fontSize: 10 }}><a href="#" style={{ color: "#F2B84B" }} onClick={(e) => { e.preventDefault(); resetAuto(h.ix); }}>수동 → 자동</a></div> : null}</td><td className="n">{((h.val / total) * 100).toFixed(1)}%</td></tr>)}
              </>); })}</tbody></table>
          <p className="muted" style={{ marginTop: 10 }}>시세가 있는 종목은 수량 × 현재가(× 환율)로 평가금이 자동 계산됩니다("자동" 표시, 영업일 기준 구글 시세). 틀렸으면 칸을 직접 고치면 그 값으로 고정되고, "수동 → 자동"으로 되돌릴 수 있습니다. 예수금·국내 비상장 항목은 직접 입력.</p>
        </div>
      </>)}


      {tab === "히트맵" && <Heat syms={[...new Set(st.holdings.filter((h) => h.sym && !["JPY=X","GC=F"].includes(h.sym)).map((h) => h.sym))]} />}
      {tab === "매매" && (<>
        <div className="card">
          <div className="eyebrow" style={{ marginBottom: 10 }}>체결 입력 → 원장 자동 갱신</div>
          <div className="form">
            <select className="in" value={form.side} onChange={(e) => setForm({ ...form, side: e.target.value })}><option>매수</option><option>매도</option></select>
            <select className="in" value={form.acct} onChange={(e) => setForm({ ...form, acct: e.target.value })}>{ACCTS.map((a) => <option key={a}>{a}</option>)}</select>
            <input placeholder="종목명 (예: AMZN)" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
            <input placeholder="수량 (예: 2 / 0.01)" type="number" step="any" value={form.qty} onChange={(e) => setForm({ ...form, qty: e.target.value })} />
            <input placeholder="체결 단가 (1주 가격)" type="number" step="any" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} />
            <select className="in" value={form.cur} onChange={(e) => setForm({ ...form, cur: e.target.value })}><option value="USD">달러 $</option><option value="KRW">원 ₩</option></select>
            <input placeholder={fxAuto ? "환율 (자동)" : "환율 (원/달러)"} type="number" value={fx} onChange={(e) => { setFx(e.target.value); localStorage.setItem("fx", e.target.value); }} />
            <select className="in" value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>{Object.keys(TYPE_COLOR).filter((t) => t !== "묶임").map((t) => <option key={t}>{t}</option>)}</select>
          </div>
          <div style={{ marginTop: 10, display: "flex", gap: 8 }}>
            <button className="btn" onClick={trade}>{form.side} 반영 {calcAmt() > 0 && `· ${fmt(calcAmt())}만원`}</button>
            <button className="btn sec" onClick={() => { if (confirm("원장을 2026.08.23 초기값으로 되돌릴까요?")) save(INIT); }}>초기값 복원</button>
          </div>
          <p className="muted" style={{ marginTop: 10 }}>{fxAuto ? `환율 ${Math.round(fxAuto*10)/10}원 (구글 실시간, 동기화 시 자동 갱신 · 직접 고쳐도 됨). ` : "시트 동기화를 켜면 환율이 자동으로 채워집니다. "}수량 × 단가 × 환율로 금액을 계산해 같은 계좌 예수금에서 차감/가산하고, 매수 시 평단을 자동 갱신합니다. 환율은 체결 당시 환율을 넣으세요. 환전은 원장 탭에서 예수금 칸을 직접 수정.</p>
        </div>
        <div className="card">
          <div className="eyebrow">최근 체결</div>
          {st.trades.length === 0 ? <p className="muted">아직 기록 없음</p> : <table><tbody>{st.trades.map((t, i) => <tr key={i}><td>{t.d}</td><td style={{ color: t.side === "매수" ? "#E5484D" : "#3E7BFA" }}>{t.side}</td><td>{t.acct} · {t.name}</td><td className="n">{t.qty}주 × {t.price}</td><td className="n">{fmt(t.amt)}만</td></tr>)}</tbody></table>}
        </div>
      </>)}

      {tab === "차트" && (<>
        <div className="card">
          <div className="form">
            <select className="in" value={chartSym} onChange={(e) => setChartSym(e.target.value)}>{[...new Set(st.holdings.filter((h) => h.sym).map((h) => h.sym)), "SPY", "QQQ", "^VIX"].map((s) => <option key={s}>{s}</option>)}</select>
            <input className="in" placeholder="직접 입력 (예: NVDA)" onChange={(e) => e.target.value && setChartSym(e.target.value.toUpperCase())} />
            <input className="in" placeholder="Twelve Data 키 (선택)" value={tdKey} onChange={(e) => { setTdKey(e.target.value); window.storage?.set("tdkey", e.target.value).catch(() => {}); }} />
            <button className="btn" onClick={loadChart}>불러오기</button>
          </div>
          <textarea className="in" rows="2" style={{ marginTop: 8 }} placeholder="API가 막히면 Yahoo Finance 'Download' CSV 내용을 여기 붙여넣고 불러오기" value={csv} onChange={(e) => setCsv(e.target.value)} />
          {chartMsg && <p className="warn" style={{ marginTop: 8 }}>{chartMsg}</p>}
        </div>
        {candles && <div className="card"><div className="eyebrow">{chartSym} · 일봉 120 · 출처 {candles.src}</div><CandleChart rows={candles.rows} /></div>}
      </>)}

      {tab === "시황" && (
        <div className="card">
