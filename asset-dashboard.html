// ───────── 지표 계산 ─────────
const sma = (a, n) => a.map((_, i) => (i < n - 1 ? null : a.slice(i - n + 1, i + 1).reduce((s, v) => s + v, 0) / n));
function rsi(c, n = 14) {
  const out = Array(c.length).fill(null);
  let g = 0, l = 0;
  for (let i = 1; i < c.length; i++) {
    const d = c[i] - c[i - 1];
    if (i <= n) { g += Math.max(d, 0); l += Math.max(-d, 0); if (i === n) { g /= n; l /= n; out[i] = 100 - 100 / (1 + g / (l || 1e-9)); } }
    else { g = (g * (n - 1) + Math.max(d, 0)) / n; l = (l * (n - 1) + Math.max(-d, 0)) / n; out[i] = 100 - 100 / (1 + g / (l || 1e-9)); }
  }
  return out;
}

// ───────── 시세 소스 ─────────
async function fetchCandles(sym, tdKey) {
  const s = sym.toUpperCase();
  if (s === "BTC" || s === "ETH") {
    const id = s === "BTC" ? "bitcoin" : "ethereum";
    const r = await fetch(`https://api.coingecko.com/api/v3/coins/${id}/ohlc?vs_currency=usd&days=180`);
    const j = await r.json();
    return { src: "CoinGecko", rows: j.map(([t, o, h, l, c]) => ({ t, o, h, l, c, v: 0 })) };
  }
  try {
    const r = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${s}?range=6mo&interval=1d`);
    const j = await r.json();
    const q = j.chart.result[0], qq = q.indicators.quote[0];
    return { src: "Yahoo Finance", rows: q.timestamp.map((t, i) => ({ t: t * 1000, o: qq.open[i], h: qq.high[i], l: qq.low[i], c: qq.close[i], v: qq.volume[i] })).filter((x) => x.c != null) };
  } catch (e) {
    if (!tdKey) throw new Error("Yahoo 직접 호출 차단됨(CORS). Twelve Data 무료 키를 입력하거나 CSV를 붙여넣으세요.");
  }
  const r = await fetch(`https://api.twelvedata.com/time_series?symbol=${s}&interval=1day&outputsize=200&apikey=${tdKey}`);
  const j = await r.json();
  if (!j.values) throw new Error(j.message || "Twelve Data 응답 없음");
  return { src: "Twelve Data", rows: j.values.reverse().map((x) => ({ t: Date.parse(x.datetime), o: +x.open, h: +x.high, l: +x.low, c: +x.close, v: +x.volume || 0 })) };
}
function parseCSV(txt) {
  const lines = txt.trim().split(/\r?\n/);
  const head = lines[0].toLowerCase().split(",");
  const ix = (k) => head.findIndex((h) => h.includes(k));
  const [d, o, h, l, c, v] = ["date", "open", "high", "low", "close", "volume"].map(ix);
  return lines.slice(1).map((ln) => { const a = ln.split(","); return { t: Date.parse(a[d]), o: +a[o], h: +a[h], l: +a[l], c: +a[c], v: +a[v] || 0 }; }).filter((x) => x.c).sort((a, b) => a.t - b.t);
}

// ───────── 차트 ─────────
function CandleChart({ rows }) {
  const W = 720, H = 420, PH = 230, VH = 60, RH = 70, PAD = { l: 8, r: 96 }, VP = 22;
  const data = rows.slice(-120);
  const closes = data.map((r) => r.c);
  const m5 = sma(closes, 5), m20 = sma(closes, 20), m60 = sma(closes, 60), rs = rsi(closes);
  const lo = Math.min(...data.map((r) => r.l)), hi = Math.max(...data.map((r) => r.h));
  const cw = (W - PAD.l - PAD.r) / data.length;
  const y = (p) => 10 + (PH - 20) * (1 - (p - lo) / (hi - lo || 1));
  const x = (i) => PAD.l + i * cw + cw / 2;
  const vmax = Math.max(...data.map((r) => r.v), 1);
  // 매물대 (volume profile)
  const bins = Array(VP).fill(0);
  data.forEach((r) => { const b = Math.min(VP - 1, Math.floor(((r.c - lo) / (hi - lo || 1)) * VP)); bins[b] += r.v || 1; });
  const bmax = Math.max(...bins), poc = bins.indexOf(bmax);
  const line = (arr, col) => <polyline fill="none" stroke={col} strokeWidth="1.3" points={arr.map((v, i) => (v == null ? null : `${x(i)},${y(v)}`)).filter(Boolean).join(" ")} />;
  const last = data[data.length - 1], lastRsi = rs[rs.length - 1];
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", fontFamily: "ui-monospace, monospace" }}>
        {bins.map((b, i) => { const yy = y(lo + ((i + 1) / VP) * (hi - lo)); const hh = (PH - 20) / VP; return <rect key={i} x={W - PAD.r + 4} y={yy} width={(b / bmax) * (PAD.r - 44)} height={hh - 1} fill={i === poc ? "#F2B84B" : "#2B3A52"} opacity="0.9" />; })}
        {[hi, (hi + lo) / 2, lo].map((p) => <text key={p} x={W - 38} y={y(p) + 4} fontSize="10" fill="#8FA3BF">{p.toFixed(p > 100 ? 0 : 2)}</text>)}
        {data.map((r, i) => { const up = r.c >= r.o; const col = up ? "#E5484D" : "#3E7BFA"; return (
          <g key={i}>
            <line x1={x(i)} x2={x(i)} y1={y(r.h)} y2={y(r.l)} stroke={col} strokeWidth="1" />
            <rect x={x(i) - cw * 0.35} y={y(Math.max(r.o, r.c))} width={cw * 0.7} height={Math.max(1, Math.abs(y(r.o) - y(r.c)))} fill={col} />
            <rect x={x(i) - cw * 0.35} y={PH + VH - (r.v / vmax) * (VH - 4)} width={cw * 0.7} height={(r.v / vmax) * (VH - 4)} fill={col} opacity="0.45" />
          </g>); })}
        {line(m5, "#F2B84B")}{line(m20, "#C98FE0")}{line(m60, "#8FA3BF")}
        <text x={PAD.l} y={PH + VH + 14} fontSize="10" fill="#8FA3BF">RSI(14) {lastRsi?.toFixed(1)}</text>
        {[70, 30].map((lv) => <line key={lv} x1={PAD.l} x2={W - PAD.r} y1={PH + VH + 20 + (RH - 24) * (1 - lv / 100)} y2={PH + VH + 20 + (RH - 24) * (1 - lv / 100)} stroke="#2B3A52" strokeDasharray="3 3" />)}
        <polyline fill="none" stroke="#F2B84B" strokeWidth="1.2" points={rs.map((v, i) => (v == null ? null : `${x(i)},${PH + VH + 20 + (RH - 24) * (1 - v / 100)}`)).filter(Boolean).join(" ")} />
      </svg>
      <div className="legend">
        <span style={{ color: "#F2B84B" }}>■ MA5</span><span style={{ color: "#C98FE0" }}>■ MA20</span><span style={{ color: "#8FA3BF" }}>■ MA60</span>
        <span>우측 막대 = 매물대(POC 노랑)</span>
        <span>종가 {last.c.toFixed(2)} · RSI {lastRsi?.toFixed(0)} {lastRsi > 70 ? "과열" : lastRsi < 30 ? "과매도" : "중립"} · {last.c > m20[m20.length - 1] ? "MA20 위" : "MA20 아래"}</span>
      </div>
    </div>
  );
}

function TV({ script, cfg, h = 520 }) {
  const ref = React.useRef();
  useEffect(() => { ref.current.innerHTML = ""; const s = document.createElement("script"); s.src = "https://s3.tradingview.com/external-embedding/" + script; s.async = true; s.innerHTML = JSON.stringify({ locale: "kr", colorTheme: "dark", width: "100%", height: h, ...cfg }); ref.current.appendChild(s); }, [script, JSON.stringify(cfg)]);
  return <div ref={ref} style={{ height: h }} />;
}

  return (<>

    <div className="tabs" style={{ margin: "0 0 12px" }}>{["내 보유", ...Object.keys(maps)].map((k) => <button key={k} className={m === k ? "on" : ""} onClick={() => setM(k)}>{k}</button>)}</div>
    <div className="card" style={{ padding: 8 }}>
      {m === "내 보유" ? (() => {
        const rows = holdings.filter((h) => h.sym && prices[h.sym]).map((h) => { const q = prices[h.sym]; const usd = isUsdQuoted(h); const krw = usd ? h.qty * q.p * fx : h.qty * q.p; return { h, q, usd, krw, dol: usd ? h.qty * q.p : (fx ? krw / fx : 0), pl: pnlOf(h) }; })
          .filter((r) => tf === "전체" || r.h.type === tf)
          .sort((a, b) => { const v = (r) => sk === "pnl" ? (r.pl ?? -999) : sk === "chg" ? (r.q.chg ?? -999) : r.krw; return sd * (v(b) - v(a)); });
        const HD = ({ k, l }) => <th className="n" style={{ cursor: "pointer", userSelect: "none" }} onClick={() => { if (sk === k) setSd(-sd); else { setSk(k); setSd(-1); } }}>{l}{sk === k ? (sd < 0 ? " ▼" : " ▲") : ""}</th>;
        return (<div>
          <div style={{ marginBottom: 8 }}>{["전체", "주식", "대체", "코인", "현금"].map((t) => <button key={t} className="chip" style={{ border: 0, cursor: "pointer", marginRight: 4, color: tf === t ? "#F2B84B" : "#E6E9EF", background: tf === t ? "#3a2f18" : "#2B3A52" }} onClick={() => setTf(t)}>{t}</button>)}</div>
          <table className="board">
            <thead><tr><th>종목</th><th className="n">현재가</th><HD k="chg" l="등락" /><HD k="pnl" l="수익률" /><HD k="val" l="평가 ₩ / $" /></tr></thead>
            <tbody>{rows.map(({ h, q, usd, krw, dol, pl }, i) => (
              <tr key={i}>
                <td style={{ fontWeight: 600 }}>{h.name}<div className="muted" style={{ fontSize: 11, fontWeight: 400 }}>{h.qty}주{h.avg ? " · 평단 " + h.avg : ""}</div></td>
                <td className="n">{usd ? "$" : "₩"}{q.p.toLocaleString(undefined, { maximumFractionDigits: 2 })}</td>
                <td className="n" style={{ color: q.chg >= 0 ? "#E5484D" : "#3E7BFA" }}>{q.chg != null ? (q.chg >= 0 ? "+" : "") + q.chg.toFixed(2) + "%" : "-"}</td>
                <td className="n" style={{ color: pl == null ? "#8FA3BF" : pl >= 0 ? "#E5484D" : "#3E7BFA", fontWeight: 600 }}>{pl == null ? "-" : (pl >= 0 ? "+" : "") + pl.toFixed(2) + "%"}</td>
                <td className="n">₩{Math.round(krw).toLocaleString()}<div className="muted" style={{ fontSize: 11 }}>${dol.toLocaleString(undefined, { maximumFractionDigits: 2 })}</div></td>
              </tr>))}</tbody>
          </table>
        </div>);
      })() : <TV script={maps[m][0]} cfg={maps[m][1]} />}
    </div>
    <p className="muted">"내 보유" 손익 보드: 국장·미장·코인·금·엔 전부 구글 시세 기준(약 15~20분 지연), 환율 자동 적용 ₩/$ 병기. "평단?"으로 뜨는 종목은 평단을 알려주면 수익률이 계산됩니다. 수익률에 등락이 안 보이면 원장 탭에서 동기화를 한 번 눌러 시세를 갱신하세요.</p>
  </>);
}

const ALLOC_TARGET = { 성장: 50, 인컴: 30, 지수: 20 };
// 성장=공격수(개별주·비지수 ETF·코인), 인컴=수비형 미드필더(배당주), 지수=수비수(지수추종 ETF·엔·금), 현금성(청약·적금·SGOV·CD·예수금)은 집계 제외
const ALLOC_EXACT = { UNH: "성장", AMZN: "성장", AVGO: "성장", NVO: "성장", JPM: "성장", BTC: "성장", "ETH 스테이킹": "성장", O: "인컴", MO: "인컴", KHC: "인컴" };
const ALLOC_INCL = [["반도체", "성장"], ["배당다우", "인컴"], ["S&P500", "지수"], ["나스닥100", "지수"], ["엔선물", "지수"], ["금현물", "지수"]];
const bucketOf = (h) => { if (h.type === "현금" || h.type === "묶임") return null; if (ALLOC_EXACT[h.name]) return ALLOC_EXACT[h.name]; for (const [k, b] of ALLOC_INCL) if (h.name.includes(k)) return b; return h.type === "대체" ? "지수" : "성장"; };
const TIER1_NAMES = ["ISA 예수금", "삼성증권 예수금", "삼성증권 원화예수금", "삼성증권 달러예수금", "키움 예수금"];
const TIER2_NAMES = ["CMA 예수금", "CD금리"];
const USD_RESERVE_NAMES = ["SGOV"];

function AllocCenter({ holdings, money }) {
  const sums = { 성장: 0, 인컴: 0, 지수: 0 };
  holdings.forEach((h) => { const b = bucketOf(h); if (b) sums[b] += h.val; });
  const tot = sums.성장 + sums.인컴 + sums.지수;
  const t1 = holdings.filter((h) => TIER1_NAMES.includes(h.name)).reduce((s, h) => s + h.val, 0);
  const t2 = holdings.filter((h) => TIER2_NAMES.includes(h.name)).reduce((s, h) => s + h.val, 0);
  const usd = holdings.filter((h) => USD_RESERVE_NAMES.includes(h.name)).reduce((s, h) => s + h.val, 0);
  const COL = { 성장: "#F2B84B", 인컴: "#C98FE0", 지수: "#3E7BFA" };
  const rows = Object.keys(ALLOC_TARGET).map((k) => { const cur = tot ? (sums[k] / tot) * 100 : 0; const tgt = ALLOC_TARGET[k]; return { k, cur, tgt, gap: cur - tgt, val: sums[k] }; });
  const worst = rows.slice().sort((a, b) => a.gap - b.gap)[0];
  return (
    <div className="card">
      <div className="eyebrow" style={{ marginBottom: 8 }}>배분 센터 · 목표 성장5 : 인컴3 : 지수2 (현금성 제외 · 엔·금은 지수 포함)</div>
      {rows.map(({ k, cur, tgt, gap, val }) => (
        <div key={k} style={{ marginBottom: 8 }}>
          <div style={{ display: "flex", justifyContent: "space-between", fontSize: 13, fontFamily: "ui-monospace,monospace" }}>
            <span style={{ color: COL[k] }}>■ {k} <span className="muted" style={{ fontSize: 11 }}>{{ 성장: "공격수", 인컴: "수비형 MF", 지수: "수비수" }[k]}</span> {money(val)}</span>
            <span>{cur.toFixed(1)}% / 목표 {tgt}% <b style={{ color: gap >= 0 ? "#E5484D" : "#3E7BFA" }}>({gap >= 0 ? "+" : ""}{gap.toFixed(1)}%p)</b></span>
          </div>
          <div style={{ position: "relative", height: 10, background: "#101826", borderRadius: 5, overflow: "hidden", marginTop: 4 }}>
            <div style={{ width: Math.min(100, cur) + "%", height: "100%", background: COL[k], opacity: 0.85 }} />
            <div style={{ position: "absolute", left: tgt + "%", top: 0, bottom: 0, width: 2, background: "#E6E9EF" }} />
          </div>
        </div>))}
      <p className="muted" style={{ margin: "4px 0 6px" }}>흰 선 = 목표 비율. 지금 가장 부족한 버킷: <b style={{ color: COL[worst.k] }}>{worst.k}</b> ({worst.gap.toFixed(1)}%p) → 급락일 매수 검토 1순위. 미분류 신규 종목은 성장으로 집계(코드 상단 ALLOC_EXACT에서 조정).</p>
      <p className="muted" style={{ margin: "0 0 10px" }}>그외 현금성 <b style={{ color: "#8FA3BF" }}>{money(holdings.filter((h) => h.type === "현금" || h.type === "묶임").reduce((s, h) => s + h.val, 0))}</b> — 청약·적금·예수금·SGOV·CD금리 (배분 집계 제외)</p>
      <div style={{ fontFamily: "ui-monospace,monospace", fontSize: 13, borderTop: "1px solid #22304a", paddingTop: 10, lineHeight: 1.8 }}>
        실탄(즉시) <b style={{ color: "#F2B84B" }}>₩{Math.round(t1 * 10000).toLocaleString()}</b> <span className="muted">증권 예수금</span>
        <span style={{ marginLeft: 12 }}>2선 ₩{Math.round(t2 * 10000).toLocaleString()} <span className="muted">CMA·CD금리(이동·매도 필요)</span></span>
        <span style={{ marginLeft: 12 }}>달러예비 ₩{Math.round(usd * 10000).toLocaleString()} <span className="muted">SGOV(매도 필요)</span></span>
      </div>
    </div>);
}

            <select className="in" value={form.acct} onChange={(e) => setForm({ ...form, acct: e.target.value })}>{ACCTS.map((a) => <option key={a}>{a}</option>)}</select>
            <input placeholder="종목명 (예: AMZN)" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
            <input placeholder="수량 (예: 2 / 0.01)" type="number" step="any" value={form.qty} onChange={(e) => setForm({ ...form, qty: e.target.value })} />
            <input placeholder="체결 단가 (1주 가격)" type="number" step="any" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} />
            <select className="in" value={form.cur} onChange={(e) => setForm({ ...form, cur: e.target.value })}><option value="USD">달러 $</option><option value="KRW">원 ₩</option></select>
            <input placeholder={fxAuto ? "환율 (자동)" : "환율 (원/달러)"} type="number" value={fx} onChange={(e) => { setFx(e.target.value); localStorage.setItem("fx", e.target.value); }} />
            <input placeholder="한줄평 (매매 이유)" value={form.memo} onChange={(e) => setForm({ ...form, memo: e.target.value })} style={{ gridColumn: "1 / -1" }} className="in" />
            <select className="in" value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>{Object.keys(TYPE_COLOR).filter((t) => t !== "묶임").map((t) => <option key={t}>{t}</option>)}</select>
          </div>
          <div style={{ marginTop: 10, display: "flex", gap: 8 }}>
            <button className="btn" onClick={trade}>{form.side} 반영 {calcAmt() > 0 && `· ${money(calcAmt())}`}</button>
            <button className="btn sec" onClick={() => { if (confirm("원장을 2026.08.23 초기값으로 되돌릴까요?")) save(INIT); }}>초기값 복원</button>
          </div>
          <p className="muted" style={{ marginTop: 10 }}>{fxAuto ? `환율 ${Math.round(fxAuto*10)/10}원 (구글 실시간, 동기화 시 자동 갱신 · 직접 고쳐도 됨). ` : "시트 동기화를 켜면 환율이 자동으로 채워집니다. "}수량 × 단가 × 환율로 금액을 계산해 같은 계좌 예수금에서 차감/가산하고, 매수 시 평단을 자동 갱신합니다. 환율은 체결 당시 환율을 넣으세요. 환전은 원장 탭에서 예수금 칸을 직접 수정.</p>
        </div>
        <div className="card">
          <div className="eyebrow">최근 체결</div>
          {st.trades.length === 0 ? <p className="muted">아직 기록 없음</p> : <table><tbody>{st.trades.map((t, i) => <tr key={i}><td>{t.d}</td><td style={{ color: t.side === "매수" ? "#E5484D" : t.side === "정산" ? "#F2B84B" : t.side === "환전" ? "#7ED491" : "#3E7BFA" }}>{t.side}</td><td>{t.acct} · {t.name}</td><td className="n">{t.side === "정산" ? t.price : t.side === "환전" ? <>${t.qty} × {t.price}</> : <>{t.qty}주 × {t.price}</>}</td><td className="n">{money(t.amt)}</td></tr>).flatMap((row, i2) => { const t = st.trades[i2]; return t.memo ? [row, <tr key={"m" + i2}><td colSpan="5" className="muted" style={{ fontSize: 12, paddingTop: 0 }}>└ {t.memo}</td></tr>] : [row]; })}</tbody></table>}
        </div>
      </>)}

      {tab === "차트" && (<>
        <div className="card" style={{ padding: 8 }}>
          <div className="eyebrow" style={{ margin: "6px 8px" }}>차트 · 국장 = 네이버증권 / 미장·코인 = 트레이딩뷰 (캔들·MA·RSI·거래량)</div>
          <div style={{ margin: "0 8px 8px", display: "flex", gap: 6, maxWidth: 560 }}>
            <input className="in" placeholder="종목 검색: 삼성전자 · 005930 · NVDA" value={symQ} onChange={(e) => setSymQ(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") goSym(symQ); }} />
            <button className="btn" onClick={() => goSym(symQ)}>차트</button>
          </div>
          {symQ.trim() && krxMatches(symQ).length > 0 && <div style={{ margin: "0 8px 8px" }}>{krxMatches(symQ).map(([n, c]) => <button key={c} className="chip" style={{ border: 0, cursor: "pointer", color: "#F2B84B" }} onClick={() => { setChartSym("KRX:" + c); setSymQ(""); }}>{n} ({c})</button>)}</div>}
          <div style={{ margin: "0 8px 8px" }}>{[...new Map(st.holdings.filter((h) => h.sym).map((h) => [h.sym, h.name])).entries()].map(([sy, nm]) => <button key={sy} className="chip" style={{ border: 0, cursor: "pointer", color: chartSym === sy ? "#F2B84B" : "#E6E9EF" }} onClick={() => setChartSym(sy)}>{sy.startsWith("KRX:") ? nm + " (" + sy.slice(4) + ")" : nm}</button>)}</div>
          {(() => { const isK = chartSym.startsWith("KRX:"); const code = isK ? chartSym.slice(4) : null; const held = st.holdings.find((h) => h.sym === chartSym || h.name === chartSym); const nm = isK ? (krxNameOf(code) || held?.name || "종목명 미확인") : (held ? held.name : chartSym); return (
            <div style={{ margin: "4px 8px 8px", display: "flex", alignItems: "baseline", gap: 10, flexWrap: "wrap" }}>
              <span style={{ fontSize: 20, fontWeight: 700, color: "#F2B84B" }}>{nm}</span>
              <span className="muted" style={{ fontFamily: "ui-monospace,monospace" }}>{isK ? `${code} · 국장 · 네이버증권 일봉` : `${chartSym} · ${chartSym.startsWith("CURRENCY:") ? "코인" : "미장"} · 트레이딩뷰`}</span>
              {held && <span className="chip" style={{ fontSize: 11 }}>보유 · {held.acct}</span>}
            </div>); })()}
          {chartSym.startsWith("KRX:") ? <NaverChart code={chartSym.slice(4)} /> : <TVChart sym={chartSym} />}
          <IndPanel sym={chartSym} />
          <div className="legend" style={{ margin: "8px" }}>국장 종목은 위 검색창에 이름(삼성전자)이나 6자리 코드(005930)를 넣으면 네이버 차트가 뜹니다 — 트레이딩뷰 무료 위젯은 국장 심볼을 지원하지 않습니다. 미국주식은 트레이딩뷰 차트 안에서 검색도 됩니다. 매물대(Volume Profile)는 트레이딩뷰 유료 기능이라 여기엔 없고, 아래 자체 차트(미국주식·코인·CSV)에서 볼 수 있습니다.</div>
        </div>

        <div className="card">
          <div className="form">
            <select className="in" value={chartSym} onChange={(e) => setChartSym(e.target.value)}>{[...new Set(st.holdings.filter((h) => h.sym).map((h) => h.sym)), "SPY", "QQQ", "^VIX"].map((s) => <option key={s}>{s}</option>)}</select>
            <input className="in" placeholder="미국 티커 (예: NVDA) — 국장은 위 검색창" onKeyDown={(e) => { if (e.key === "Enter") goSym(e.target.value); }} onBlur={(e) => e.target.value.trim() && goSym(e.target.value)} />
            <input className="in" placeholder="Twelve Data 키 (선택)" value={tdKey} onChange={(e) => { setTdKey(e.target.value); window.storage?.set("tdkey", e.target.value).catch(() => {}); }} />
            <button className="btn" onClick={loadChart}>불러오기</button>
          </div>
          <textarea className="in" rows="2" style={{ marginTop: 8 }} placeholder="API가 막히면 Yahoo Finance 'Download' CSV 내용을 여기 붙여넣고 불러오기" value={csv} onChange={(e) => setCsv(e.target.value)} />
          {chartMsg && <p className="warn" style={{ marginTop: 8 }}>{chartMsg}</p>}
        </div>
        {candles && <div className="card"><div className="eyebrow">{chartSym} · 일봉 120 · 출처 {candles.src}</div><CandleChart rows={candles.rows} /></div>}
      </>)}

      {tab === "공포지수" && (() => { const sums = { 성장: 0, 인컴: 0, 지수: 0 }; view.holdings.forEach((h) => { const b = bucketOf(h); if (b) sums[b] += h.val; }); const tot = sums.성장 + sums.인컴 + sums.지수; const worst = Object.keys(ALLOC_TARGET).map((k) => ({ k, gap: (tot ? (sums[k] / tot) * 100 : 0) - ALLOC_TARGET[k] })).sort((a, b) => a.gap - b.gap)[0]; const t1 = view.holdings.filter((h) => TIER1_NAMES.includes(h.name)).reduce((s2, h) => s2 + h.val, 0); return <FearTab worst={worst} money={money} t1={t1} />; })()}

      {tab === "시황" && (
        <div className="card">
          <div className="eyebrow" style={{ marginBottom: 8 }}>시황 분석 · 매매 상담</div>
          <p>시황 분석과 매수·매도 상담은 <b>클로드 프로젝트 채팅</b>("93년생 dop 자산 포폴")에서 합니다. 클로드가 이 원장을 직접 읽고 웹검색 시황과 대조해 의견 + 반대의견을 줍니다. 구독에 포함이라 추가 비용 없음.</p>
          <p style={{ marginTop: 8 }}><a href="https://claude.ai" target="_blank" style={{ color: "#F2B84B" }}>claude.ai 열기 →</a></p>
          <p className="muted" style={{ marginTop: 10 }}>규칙: 10만원 이상 매매는 반드시 채팅 먼저. 체결 후엔 매매 탭에 기록해야 다음 상담이 정확합니다. 예시 질문: "오늘 시황 분석" / "잭슨홀 전 상황 브리핑" / "AMZN 1주 더 살까?"</p>
        </div>
      )}
      <div style={{ textAlign: "right", marginTop: 30, fontFamily: "ui-monospace,monospace", fontSize: 10, color: "#4F5E75" }}>최종 수정 2026-09-08 10:40</div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

</script></body></html>
